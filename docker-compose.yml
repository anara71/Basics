version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@db:5432/billionaire_tracker
    depends_on:
      - db
    volumes:
      - ./instance:/app/instance
    command: >
      sh -c "python download_billionaires.py &&
             gunicorn --bind 0.0.0.0:5000 --workers 4 app:app"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=billionaire_tracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
