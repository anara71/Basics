services:
  # PostgreSQL Database
  - type: pserv
    name: billionaire-tracker-db
    env: docker
    plan: free
    image: postgres:15-alpine
    disk:
      name: billionaire-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Web Service
  - type: web
    name: billionaire-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: billionaire-tracker-db
          property: connectionString
